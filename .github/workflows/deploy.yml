# Nasazení složky site/ na FTP hosting Gigaserver při každém push do master.
#
# Secrets (Settings → Secrets and variables → Actions → Secrets):
#   FTP_PASSWORD  – heslo FTP účtu
# Variables (tamtéž → Variables, nepovinné):
#   FTP_USER        – výchozí mirekstrnad_eu_mirek
#   FTP_HOST        – výchozí ftp.mirekstrnad.eu (záložní 185.66.36.178)
#   FTP_SERVER_DIR  – výchozí "/" (kořen FTP účtu = /www/mirekstrnad.eu)
#
# Nejdřív se zkusí FTPS (šifrované); když server TLS neumí, použije se FTP.
name: Deploy to FTP

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_HOST: ${{ vars.FTP_HOST || 'ftp.mirekstrnad.eu' }}
      FTP_USER: ${{ vars.FTP_USER || 'mirekstrnad_eu_mirek' }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy site/ (FTPS)
        id: ftps
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: site/
          server-dir: ${{ env.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.DS_Store
            **/.git*

      - name: Deploy site/ (FTP fallback)
        if: steps.ftps.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: site/
          server-dir: ${{ env.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.DS_Store
            **/.git*
