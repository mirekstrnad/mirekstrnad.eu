    :root{
      color-scheme:light dark;
      --bg:#fff;
      --card:#fff;
      --text:#111;
      --muted:#595959;      /* 7.0:1 na bílé */
      --link:#07548c;       /* 7.9:1 na bílé */
      --focus:#07548c;
      --gap:30px;
      --card-w:740px;
      --photo-w:299px;
      --photo-h:339px;
    }
    @media (prefers-color-scheme:dark){
      :root{
        --bg:#111;
        --card:#1c1c1c;
        --text:#ececec;
        --muted:#b0b0b0;
        --link:#7fb6e6;     /* 8.5:1 na #1c1c1c */
        --focus:#7fb6e6;
      }
    }

    *,*::before,*::after{box-sizing:border-box}
    html{height:100%}
    body{
      margin:0;min-height:100%;
      background:var(--bg);color:var(--text);
      font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      font-size:15px;line-height:1.5;
    }

    /* ---------- karta ---------- */
    .card{
      display:flex;flex-direction:column;
      max-width:480px;margin:16px auto;
      background:var(--card);
    }
    .card__photo{display:block;width:100%;height:auto;max-height:46vh;aspect-ratio:299/339;object-fit:cover;object-position:50% 15%}
    .card__body{padding:16px 20px 20px}

    h1{margin:0 0 6px;font-size:clamp(34px,10vw,55px);font-weight:300;line-height:1;letter-spacing:-.01em;overflow-wrap:anywhere}
    .tagline{margin:0 0 18px;color:var(--muted);font-size:18px;line-height:1.2}
    .lead{margin:0 0 18px}
    h2{margin:14px 0 4px;font-size:19px;font-weight:400;line-height:1.3}
    address{font-style:normal}
    ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:0 18px}
    li a{
      display:inline-flex;align-items:center;gap:7px;
      min-height:44px;padding:0 2px;
      color:var(--link);text-decoration:none;white-space:nowrap;
    }
    li a:hover,li a:focus-visible{text-decoration:underline}
    a:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
    .icon{width:16px;height:16px;flex:none;fill:currentColor;color:var(--text)}

    /* ---------- desktop: pozadí + karta vlevo dole ---------- */
    @media (min-width:900px) and (min-height:500px){
      body{height:100%;overflow:hidden;position:relative;isolation:isolate}
      body::before{
        content:"";position:fixed;inset:0;z-index:-2;
        background:#9a9a9a url(/design/bg-1920.jpg) 50% 50%/cover no-repeat;
        background-image:image-set(
          url(/design/bg-1920.avif) type("image/avif"),
          url(/design/bg-1920.webp) type("image/webp"),
          url(/design/bg-1920.jpg) type("image/jpeg"));
      }
      @media (min-width:1921px),(min-resolution:1.5dppx){
        body::before{
          background-image:image-set(
            url(/design/bg-2560.avif) type("image/avif"),
            url(/design/bg-2560.webp) type("image/webp"),
            url(/design/bg-2560.jpg) type("image/jpeg"));
        }
      }
      /* jemný vzor přes pozadí (původní pattern.png nahrazen gradientem) */
      body::after{
        content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
        background:repeating-linear-gradient(135deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px);
      }
      .card{
        flex-direction:row;align-items:stretch;
        position:absolute;left:var(--gap);bottom:var(--gap);
        width:var(--card-w);max-width:calc(100vw - 2*var(--gap));margin:0;
        box-shadow:0 2px 24px rgba(0,0,0,.25);
      }
      .card__photo{width:var(--photo-w);height:auto;max-height:none;flex:none;aspect-ratio:299/339;object-fit:cover;align-self:flex-start}
      .card__body{flex:1 1 auto;padding:14px 20px 18px}
      h1{font-size:55px}
      .tagline{font-size:18px}
      ul{gap:0 16px}
      li a{min-height:32px}
    }
    @media (prefers-color-scheme:dark) and (min-width:900px) and (min-height:500px){
      body::before{filter:brightness(.55)}
    }
    @media (prefers-reduced-motion:no-preference){
      a{transition:color .15s}
    }

    /* ---------- tisk ---------- */
    @media print{
      body::before,body::after{display:none}
      .card{position:static;box-shadow:none;max-width:none;flex-direction:row}
      .card__photo{width:160px}
      a{color:#000}
      li a[href^="http"]::after{content:" (" attr(href) ")";font-size:12px;color:#444}
      .icon{display:none}
    }
  </style>
